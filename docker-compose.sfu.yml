services:
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--bind",
        "127.0.0.1",
      ]
    network_mode: "host"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  sfu-a:
    build:
      context: ./sfu
    network_mode: "host"
    environment:
      SFU_PORT: "3031"
      SFU_INSTANCE_ID: "sfu-a"
      SFU_SECRET: ${SFU_SECRET}
      SFU_DRAINING: "false"
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "41000"
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      SFU_VERSION: "v1"
    restart: unless-stopped

  sfu-b:
    build:
      context: ./sfu
    network_mode: "host"
    environment:
      SFU_PORT: "3032"
      SFU_INSTANCE_ID: "sfu-b"
      SFU_SECRET: ${SFU_SECRET}
      SFU_DRAINING: "false"
      RTC_MIN_PORT: "41001"
      RTC_MAX_PORT: "42000"
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      SFU_VERSION: "v2"
    restart: unless-stopped

volumes:
  redis-data:
